
name: Build MadSimonX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Visual Studio project
        id: project
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path msvc -Recurse -File |
            Where-Object { $_.Extension -in '.sln', '.vcxproj' } |
            Sort-Object @{Expression={if ($_.Extension -eq '.sln') {0} else {1}}} |
            Select-Object -First 1
          if (-not $file) {
            throw "No Visual Studio project found"
          }
          "path=$($file.FullName)" >> $env:GITHUB_OUTPUT


      - name: Build MadSimonX
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" |
            Select-Object -First 1

          $solution = "${{ steps.project.outputs.path }}"

          Write-Host "Available configurations:"
          $inside = $false
          foreach ($line in Get-Content $solution) {
            if ($line -match 'GlobalSection\(SolutionConfigurationPlatforms\)') {
              $inside = $true
              continue
            }
            if ($inside -and $line -match 'EndGlobalSection') {
              break
            }
            if ($inside) {
              Write-Host $line
            }
          }

          Write-Host "Building default configuration..."
          & $msbuild $solution /m
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }


  
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: MadSimonX-DLL
          path: msvc/bin/Debug/Win32/CrashRpt.dll
          if-no-files-found: error
